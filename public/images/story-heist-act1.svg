<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Act I living room planning">
  <title>The Planning Room</title>
  <style>
    .tail { transform-box: fill-box; transform-origin: left center; animation: flick 1.2s ease-in-out infinite; }
    .monocle { transform-box: fill-box; transform-origin: center; animation: gleam 2.4s ease-in-out infinite; }
    .page { animation: flip 3s steps(2) infinite; }
    .fish { transform-box: fill-box; transform-origin: center; animation: tilt 2s ease-in-out infinite; }
    .kibble { animation: twinkle 1.8s ease-in-out infinite; }
    .band { transform-origin: 560px 430px; animation: twang 1.1s ease-in-out infinite; }
    @keyframes flick { 0%,100% { transform: rotate(-8deg);} 50% { transform: rotate(16deg);} }
    @keyframes gleam { 0%,100% { opacity: 1;} 50% { opacity: 0.35;} }
    @keyframes flip { 0%,49% { transform: scaleX(1);} 50%,100% { transform: scaleX(0.2);} }
    @keyframes tilt { 0%,100% { transform: rotate(-8deg);} 50% { transform: rotate(10deg);} }
    @keyframes twinkle { 0%,100% { opacity: 0.5;} 50% { opacity: 1;} }
    @keyframes twang { 0%,100% { transform: scaleX(1);} 50% { transform: scaleX(1.08);} }
    @media (prefers-reduced-motion: reduce) { .tail,.monocle,.page,.fish,.kibble,.band { animation: none; } }
  </style>
  <rect width="800" height="600" fill="#f3e2c7"/>
  <rect x="0" y="0" width="800" height="210" fill="#d9c2a0"/>
  <rect x="70" y="36" width="120" height="80" rx="6" fill="#8fd4ff"/>
  <rect x="620" y="40" width="110" height="74" rx="6" fill="#c9e4b4"/>
  <rect x="40" y="250" width="720" height="170" rx="18" fill="#b56b3a"/>
  <rect x="58" y="268" width="684" height="110" rx="12" fill="#8a4b28"/>
  <path d="M80 290 l40 20 l80 -16 l70 22 l90 -18 l60 14 l100 -20" fill="none" stroke="#f4d7b0" stroke-width="3"/>
  <rect x="250" y="300" width="220" height="70" rx="6" fill="#efe4cf" opacity="0.9"/>
  <path d="M262 318 h90 v36 h-40 v-20 h70" fill="none" stroke="#3a2a1a" stroke-width="2"/>
  <path d="M370 318 q40 10 80 0" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="360" y="360" text-anchor="middle" font-size="11" fill="#5a3a1c">PANTRY to TREATS</text>
  <ellipse cx="210" cy="230" rx="48" ry="28" fill="#c4c8cc"/>
  <circle cx="210" cy="200" r="26" fill="#d0d4d8"/>
  <ellipse cx="196" cy="196" rx="5" ry="6" fill="#2b2118"/>
  <circle class="monocle" cx="226" cy="196" r="8" fill="none" stroke="#d4af37" stroke-width="3"/>
  <path d="M234 202 q10 14 4 28" fill="none" stroke="#d4af37" stroke-width="2"/>
  <ellipse class="tail" cx="150" cy="236" rx="22" ry="8" fill="#b0b4b8"/>
  <rect x="198" y="176" width="22" height="10" rx="2" fill="#2b2118"/>
  <ellipse cx="430" cy="236" rx="40" ry="22" fill="#e8b86a"/>
  <circle cx="458" cy="214" r="16" fill="#f0c36a"/>
  <circle cx="394" cy="248" r="12" fill="#d4a054"/>
  <circle cx="400" cy="210" r="3" fill="#2b2118"/>
  <ellipse cx="330" cy="430" rx="18" ry="14" fill="#e8b86a"/>
  <circle cx="330" cy="418" r="9" fill="#f0c36a"/>
  <circle cx="318" cy="430" r="10" fill="#d4a054" opacity="0.5"/>
  <ellipse cx="560" cy="248" rx="22" ry="16" fill="#ff8a4c"/>
  <circle cx="576" cy="236" r="10" fill="#ff8a4c"/>
  <path d="M584 234 l12 2 l-12 3 z" fill="#f4a261"/>
  <rect x="500" y="400" width="130" height="16" rx="4" fill="#8a6a44"/>
  <rect x="548" y="368" width="16" height="40" rx="4" fill="#c0c4c8"/>
  <path class="band" d="M520 404 Q 560 360 600 404" fill="none" stroke="#e85d4c" stroke-width="4"/>
  <g transform="translate(70 470)">
    <ellipse cx="20" cy="20" rx="16" ry="10" fill="#d8d0c4"/>
    <rect class="page" x="12" y="12" width="16" height="14" fill="#fff"/>
    <text x="20" y="48" text-anchor="middle" font-size="9" fill="#4a3b2f">Heist Mgmt</text>
  </g>
  <g transform="translate(660 430)">
    <ellipse cx="36" cy="36" rx="32" ry="26" fill="#7ad7ff" opacity="0.55"/>
    <ellipse class="fish" cx="36" cy="36" rx="14" ry="8" fill="#ff8a4c"/>
    <rect x="28" y="30" width="10" height="6" rx="2" fill="#2b2118"/>
  </g>
  <g class="kibble" fill="#c06a2a">
    <circle cx="120" cy="540" r="4"/>
    <circle cx="136" cy="548" r="4"/>
    <circle cx="152" cy="538" r="4"/>
    <circle cx="168" cy="550" r="4"/>
    <circle cx="186" cy="542" r="4"/>
  </g>
  <text x="154" y="572" text-anchor="middle" font-size="13" fill="#6b3e1d">kibble code: G O</text>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-family="Georgia, serif" fill="#5a3a1c">How it actually started</text>
</svg>
