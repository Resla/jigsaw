<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Act II kitchen chaos">
  <title>The Obstacle Course</title>
  <style>
    .ball { animation: roll 2.8s linear infinite; }
    .wing { transform-box: fill-box; transform-origin: left center; animation: flap 0.55s ease-in-out infinite; }
    .bacon { animation: fall 2.2s ease-in-out infinite; }
    .light { animation: strobe 1.4s steps(2) infinite; }
    .slink { animation: sneak 3s ease-in-out infinite; }
    .drool { animation: drip 1.2s ease-in-out infinite; }
    @keyframes roll { 0% { transform: translate(0,0) rotate(0);} 100% { transform: translate(140px, 8px) rotate(360deg);} }
    @keyframes flap { 0%,100% { transform: rotate(8deg);} 50% { transform: rotate(-22deg);} }
    @keyframes fall { 0% { transform: translate(0,-10px) rotate(-12deg);} 100% { transform: translate(12px, 70px) rotate(18deg);} }
    @keyframes strobe { 0% { opacity: 0.2;} 50% { opacity: 1;} }
    @keyframes sneak { 0%,100% { transform: translate(0,0);} 50% { transform: translate(16px,-4px);} }
    @keyframes drip { 0%,100% { transform: scaleY(0.6); opacity: 0.4;} 50% { transform: scaleY(1.2); opacity: 1;} }
    @media (prefers-reduced-motion: reduce) { .ball,.wing,.bacon,.light,.slink,.drool { animation: none; } }
  </style>
  <rect width="800" height="600" fill="#f7efe6"/>
  <rect x="0" y="0" width="800" height="160" fill="#efe0cc"/>
  <rect x="0" y="360" width="800" height="240" fill="#e8d3b0"/>
  <rect x="0" y="360" width="800" height="16" fill="#c9a36a"/>
  <rect x="480" y="120" width="280" height="240" fill="#dce8f4"/>
  <rect x="500" y="150" width="90" height="120" rx="6" fill="#9ad0ea"/>
  <rect x="610" y="150" width="90" height="120" rx="6" fill="#9ad0ea"/>
  <rect x="40" y="200" width="200" height="160" rx="8" fill="#cfd4da"/>
  <circle class="light" cx="140" cy="188" r="16" fill="#ffe36b"/>
  <rect x="300" y="220" width="150" height="140" rx="8" fill="#8a8f96"/>
  <g class="ball">
    <circle cx="180" cy="330" r="28" fill="#7ad7ff" opacity="0.45" stroke="#3a2a1a" stroke-width="2"/>
    <ellipse cx="180" cy="330" rx="10" ry="8" fill="#e8b86a"/>
  </g>
  <g transform="translate(620 80)">
    <ellipse cx="40" cy="36" rx="22" ry="16" fill="#4db7ff"/>
    <circle cx="58" cy="26" r="10" fill="#4db7ff"/>
    <path class="wing" d="M20 36 q-20 -8 -8 12" fill="#7ad7ff"/>
    <path d="M66 26 l12 2 l-12 3 z" fill="#f4a261"/>
    <circle cx="62" cy="24" r="2" fill="#2b2118"/>
  </g>
  <g transform="translate(340 300)">
    <ellipse cx="70" cy="70" rx="54" ry="30" fill="#f0b15a"/>
    <circle cx="108" cy="50" r="22" fill="#f4c06a"/>
    <ellipse cx="28" cy="58" rx="16" ry="22" fill="#d9842f"/>
    <circle cx="118" cy="46" r="4" fill="#2b2118"/>
    <ellipse cx="122" cy="58" rx="8" ry="5" fill="#3a2a1a"/>
    <path class="drool" d="M126 64 v14" stroke="#7ad7ff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <rect class="bacon" x="430" y="200" width="46" height="14" rx="4" fill="#e85d4c"/>
  <g class="slink">
    <ellipse cx="260" cy="340" rx="28" ry="16" fill="#c4c8cc"/>
    <circle cx="282" cy="326" r="14" fill="#d0d4d8"/>
    <circle class="monocle" cx="290" cy="324" r="6" fill="none" stroke="#d4af37" stroke-width="2"/>
  </g>
  <rect x="40" y="470" width="70" height="50" rx="6" fill="#7cbc68" opacity="0.5"/>
  <path d="M80 520 q 30 20 70 0" fill="none" stroke="#3fa24c" stroke-width="8"/>
  <g fill="#c06a2a">
    <circle cx="520" cy="540" r="3.5"/>
    <circle cx="534" cy="548" r="3.5"/>
    <circle cx="548" cy="538" r="3.5"/>
    <circle cx="564" cy="546" r="3.5"/>
  </g>
  <text x="400" y="40" text-anchor="middle" font-size="20" font-family="Georgia, serif" fill="#5a3a1c">How it actually went</text>
  <text x="140" y="580" text-anchor="middle" font-size="12" fill="#6b3e1d">sensor: ?????</text>
</svg>
