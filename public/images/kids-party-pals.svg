<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Party Pals">
  <title>Party Pals</title>
  <desc>A birthday room with a flickering cake, falling confetti, and pals in party hats.</desc>
  <style>
    .banner { transform-box: fill-box; transform-origin: top center; animation: flutter 2.6s ease-in-out infinite; }
    .banner.b2 { animation-delay: 0.3s; }
    .candle { transform-box: fill-box; transform-origin: bottom center; animation: flicker 0.7s ease-in-out infinite; }
    .candle.c2 { animation-delay: 0.2s; }
    .candle.c3 { animation-delay: 0.4s; }
    .hat-bear { transform-box: fill-box; transform-origin: bottom center; animation: wiggle 1.8s ease-in-out infinite; }
    .hat-pup { transform-box: fill-box; transform-origin: bottom center; animation: wiggle 2s ease-in-out infinite 0.3s; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s ease-in-out infinite; }
    .confetti { animation: fall 4.5s linear infinite; }
    .confetti.c2 { animation-delay: -1s; }
    .confetti.c3 { animation-delay: -2.2s; }
    .balloon-p { transform-origin: 120px 210px; animation: bob 2.8s ease-in-out infinite; }
    .balloon-q { transform-origin: 680px 200px; animation: bob 3.1s ease-in-out infinite 0.5s; }
    .pup-tail { transform-box: fill-box; transform-origin: left center; animation: wag 0.5s ease-in-out infinite; }
    @keyframes flutter {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes flicker {
      0%, 100% { transform: scaleY(1) scaleX(1); opacity: 1; }
      50% { transform: scaleY(1.2) scaleX(0.8); opacity: 0.75; }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(7deg); }
    }
    @keyframes blink {
      0%, 42%, 46%, 100% { transform: scaleY(1); }
      44% { transform: scaleY(0.08); }
    }
    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0); opacity: 1; }
      100% { transform: translateY(420px) rotate(180deg); opacity: 0.2; }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-12px) rotate(4deg); }
    }
    @keyframes wag {
      0%, 100% { transform: rotate(-16deg); }
      50% { transform: rotate(20deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .banner, .candle, .hat-bear, .hat-pup, .eye, .confetti, .balloon-p, .balloon-q, .pup-tail { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="partyWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe3f0"/>
      <stop offset="100%" stop-color="#fff1d6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#partyWall)"/>
  <rect x="0" y="470" width="800" height="130" fill="#f4d7b0"/>
  <rect x="0" y="470" width="800" height="14" fill="#e8b86d"/>
  <g class="banner" fill="#ff6b9d"><path d="M80 40 l24 46 l-24 0 z"/></g>
  <g class="banner b2" fill="#ffe066"><path d="M130 40 l24 46 l-24 0 z"/></g>
  <g class="banner" fill="#4db7ff"><path d="M180 40 l24 46 l-24 0 z"/></g>
  <g class="banner b2" fill="#b388ff"><path d="M230 40 l24 46 l-24 0 z"/></g>
  <g class="banner" fill="#5ad16a"><path d="M280 40 l24 46 l-24 0 z"/></g>
  <g class="banner b2" fill="#ff8a4c"><path d="M520 40 l24 46 l-24 0 z"/></g>
  <g class="banner" fill="#ff6b9d"><path d="M570 40 l24 46 l-24 0 z"/></g>
  <g class="banner b2" fill="#ffe066"><path d="M620 40 l24 46 l-24 0 z"/></g>
  <g class="banner" fill="#4db7ff"><path d="M670 40 l24 46 l-24 0 z"/></g>
  <path d="M70 40 H 310 M 510 40 H 710" stroke="#c97a86" stroke-width="4"/>
  <g class="balloon-p">
    <ellipse cx="120" cy="180" rx="28" ry="36" fill="#ff5a5a"/>
    <path d="M120 216 v70" stroke="#6b4a32" stroke-width="2"/>
  </g>
  <g class="balloon-q">
    <ellipse cx="680" cy="170" rx="26" ry="34" fill="#4db7ff"/>
    <path d="M680 204 v70" stroke="#6b4a32" stroke-width="2"/>
  </g>
  <rect class="confetti" x="200" y="70" width="10" height="16" rx="2" fill="#ff6b9d"/>
  <rect class="confetti c2" x="360" y="40" width="10" height="16" rx="2" fill="#ffe066"/>
  <rect class="confetti c3" x="500" y="80" width="10" height="16" rx="2" fill="#4db7ff"/>
  <rect class="confetti" x="640" y="50" width="10" height="16" rx="2" fill="#b388ff"/>
  <rect class="confetti c2" x="280" y="90" width="10" height="16" rx="2" fill="#5ad16a"/>
  <g transform="translate(330 300)">
    <rect x="20" y="80" width="140" height="70" rx="12" fill="#ffd1e8"/>
    <rect x="10" y="50" width="160" height="40" rx="16" fill="#fff7f0"/>
    <rect x="36" y="20" width="108" height="40" rx="14" fill="#ff8ac5"/>
    <g class="candle"><rect x="56" y="0" width="8" height="24" rx="3" fill="#ffe066"/><ellipse cx="60" cy="-2" rx="5" ry="8" fill="#ff8a4c"/></g>
    <g class="candle c2"><rect x="86" y="-6" width="8" height="30" rx="3" fill="#4db7ff"/><ellipse cx="90" cy="-8" rx="5" ry="8" fill="#ffb347"/></g>
    <g class="candle c3"><rect x="116" y="0" width="8" height="24" rx="3" fill="#b388ff"/><ellipse cx="120" cy="-2" rx="5" ry="8" fill="#ff8a4c"/></g>
    <circle cx="50" cy="68" r="6" fill="#ff6b9d"/>
    <circle cx="90" cy="72" r="6" fill="#4db7ff"/>
    <circle cx="130" cy="68" r="6" fill="#ffe066"/>
  </g>
  <g transform="translate(120 330)">
    <ellipse cx="70" cy="130" rx="42" ry="28" fill="#d4a574"/>
    <circle cx="70" cy="86" r="36" fill="#e0b68a"/>
    <ellipse cx="42" cy="70" rx="14" ry="18" fill="#c48a4a"/>
    <ellipse cx="98" cy="70" rx="14" ry="18" fill="#c48a4a"/>
    <g class="eye">
      <ellipse cx="56" cy="84" rx="4.5" ry="5.2" fill="#2b2118"/>
      <ellipse cx="84" cy="84" rx="4.5" ry="5.2" fill="#2b2118"/>
    </g>
    <ellipse cx="70" cy="96" rx="7" ry="5" fill="#3a2a1a"/>
    <path d="M58 108 q12 8 24 0" fill="none" stroke="#a86b32" stroke-width="3" stroke-linecap="round"/>
    <g class="hat-bear">
      <path d="M48 52 l22 -36 l22 36 z" fill="#ff6b9d"/>
      <circle cx="70" cy="16" r="6" fill="#ffe066"/>
    </g>
  </g>
  <g transform="translate(520 340)">
    <ellipse cx="70" cy="126" rx="44" ry="26" fill="#f0b15a"/>
    <ellipse class="pup-tail" cx="118" cy="110" rx="16" ry="8" fill="#e0923a"/>
    <circle cx="70" cy="84" r="32" fill="#f4c06a"/>
    <ellipse cx="44" cy="70" rx="14" ry="20" fill="#d9842f" transform="rotate(-16 44 70)"/>
    <ellipse cx="96" cy="70" rx="14" ry="20" fill="#d9842f" transform="rotate(16 96 70)"/>
    <g class="eye">
      <ellipse cx="58" cy="80" rx="4.2" ry="5" fill="#2b2118"/>
      <ellipse cx="82" cy="80" rx="4.2" ry="5" fill="#2b2118"/>
    </g>
    <ellipse cx="70" cy="92" rx="8" ry="6" fill="#3a2a1a"/>
    <path d="M58 104 q12 8 24 0" fill="none" stroke="#c06a2a" stroke-width="2.6" stroke-linecap="round"/>
    <g class="hat-pup">
      <path d="M50 54 l20 -34 l20 34 z" fill="#4db7ff"/>
      <circle cx="70" cy="20" r="6" fill="#ff6b9d"/>
    </g>
  </g>
  <rect x="300" y="430" width="44" height="40" rx="6" fill="#ff8a4c"/>
  <rect x="296" y="424" width="52" height="12" rx="4" fill="#ffe066"/>
  <rect x="460" y="436" width="40" height="34" rx="6" fill="#b388ff"/>
  <rect x="456" y="430" width="48" height="10" rx="4" fill="#5ad16a"/>
</svg>
