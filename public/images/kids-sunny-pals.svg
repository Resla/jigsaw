    <path d="M94 130 q12 -14 24 0"/>
  </g>
  <g class="bird b2" fill="none" stroke="#4a3b2f" stroke-width="3" stroke-linecap="round">
    <path d="M200 150 q10 -12 20 0"/>
    <path d="M220 150 q10 -12 20 0"/>
  </g>

  <path d="M-20 360 C 120 250, 260 250, 400 320 C 520 380, 680 300, 840 340 L 840 600 L -20 600 Z" fill="url(#hillBack)"/>
  <path d="M-40 430 C 140 330, 300 350, 460 410 C 600 460, 720 380, 860 420 L 860 600 L -40 600 Z" fill="url(#hillFront)"/>

  <g class="tree-top">
    <rect x="718" y="330" width="16" height="70" rx="6" fill="#b56b2a"/>
    <circle cx="726" cy="318" r="38" fill="#3f9a4a"/>
    <circle cx="702" cy="338" r="24" fill="#4fb85a"/>
    <circle cx="750" cy="336" r="22" fill="#2f8a3e"/>
  </g>

  <g class="kite">
    <path d="M690 210 L 730 250 L 690 290 L 650 250 Z" fill="#ff6b9d"/>
    <path d="M690 210 L 730 250 L 690 250 Z" fill="#ffe066"/>
    <path d="M690 250 L 650 250 L 690 290 Z" fill="#5ad1ff"/>
    <path d="M690 290 C 700 320, 680 340, 704 368" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
