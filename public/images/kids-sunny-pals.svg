    <ellipse cx="236" cy="250" rx="8" ry="12" fill="#ff8a8a" opacity="0.5"/>
    <path d="M248 318 L 248 390" fill="none" stroke="#6b4a32" stroke-width="2"/>
  </g>
  <g class="balloon-yellow">
