    <ellipse cx="56" cy="112" rx="24" ry="10" fill="#3fa24c"/>
    <ellipse cx="56" cy="92" rx="40" ry="30" fill="#f4a261"/>
    <path class="kitty-tail" d="M96 90 q28 -6 34 20" fill="none" stroke="#e76f51" stroke-width="10" stroke-linecap="round"/>
    <polygon points="28,48 36,18 48,50" fill="#f4a261"/>
    <polygon points="64,50 76,18 84,48" fill="#f4a261"/>
    <polygon points="32,46 36,28 44,48" fill="#ffd3c2"/>
    <polygon points="68,48 76,28 80,46" fill="#ffd3c2"/>
    <circle cx="56" cy="70" r="28" fill="#f6b57a"/>
    <g class="eye">
      <ellipse cx="44" cy="68" rx="4.6" ry="5.4" fill="#2b2118"/>
      <ellipse cx="68" cy="68" rx="4.6" ry="5.4" fill="#2b2118"/>
      <circle cx="45.4" cy="66.2" r="1.4" fill="#fff"/>
      <circle cx="69.4" cy="66.2" r="1.4" fill="#fff"/>
    </g>
    <polygon points="56,76 50,84 62,84" fill="#ff8fa3"/>
    <path d="M56 84 v7" stroke="#c97a86" stroke-width="2"/>
    <path d="M40 80 h-16 M40 86 h-14" stroke="#7a4e30" stroke-width="2" stroke-linecap="round"/>
    <path d="M72 80 h16 M72 86 h14" stroke="#7a4e30" stroke-width="2" stroke-linecap="round"/>
    <path d="M44 92 q12 8 24 0" fill="none" stroke="#d35400" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="38" cy="118" rx="9" ry="7" fill="#e76f51"/>
    <ellipse cx="74" cy="118" rx="9" ry="7" fill="#e76f51"/>
  </g>

  <g class="flower">
    <rect x="86" y="508" width="6" height="36" rx="3" fill="#2f8a3e"/>
    <circle cx="89" cy="500" r="12" fill="#ff6b9d"/>
    <circle cx="89" cy="500" r="5" fill="#ffe066"/>
  </g>
  <g class="flower f2">
    <rect x="230" y="520" width="6" height="32" rx="3" fill="#2f8a3e"/>
    <circle cx="233" cy="514" r="11" fill="#7ad7ff"/>
    <circle cx="233" cy="514" r="4.5" fill="#fff3a8"/>
  </g>
  <g class="flower f3">
    <rect x="490" y="516" width="6" height="34" rx="3" fill="#2f8a3e"/>
    <circle cx="493" cy="508" r="12" fill="#ffe066"/>
    <circle cx="493" cy="508" r="5" fill="#ff8ac5"/>
  </g>
  <g class="flower f4">
