    <circle cx="28" cy="78" r="6" fill="#ffb7c5" opacity="0.7"/>
    <circle cx="76" cy="78" r="6" fill="#ffb7c5" opacity="0.7"/>
  </g>

  <!-- Puppy -->
  <g transform="translate(330 378)">
    <ellipse cx="70" cy="118" rx="28" ry="11" fill="#3fa24c"/>
    <ellipse cx="70" cy="96" rx="48" ry="32" fill="#f0b15a"/>
    <ellipse class="tail" cx="122" cy="88" rx="16" ry="8" fill="#e0923a"/>
    <ellipse cx="36" cy="64" rx="16" ry="22" fill="#d9842f" transform="rotate(-18 36 64)"/>
    <ellipse cx="100" cy="62" rx="16" ry="22" fill="#d9842f" transform="rotate(18 100 62)"/>
    <circle cx="70" cy="72" r="30" fill="#f4c06a"/>
    <ellipse cx="70" cy="86" rx="18" ry="14" fill="#ffe6b8"/>
    <g class="eye">
      <ellipse cx="56" cy="66" rx="4.4" ry="5.2" fill="#2b2118"/>
      <ellipse cx="84" cy="66" rx="4.4" ry="5.2" fill="#2b2118"/>
      <circle cx="57.5" cy="64.4" r="1.4" fill="#fff"/>
      <circle cx="85.5" cy="64.4" r="1.4" fill="#fff"/>
    </g>
    <ellipse cx="70" cy="78" rx="8" ry="6" fill="#3a2a1a"/>
    <circle cx="66" cy="76" r="1.4" fill="#fff" opacity="0.5"/>
    <path d="M56 90 q14 10 28 0" fill="none" stroke="#c06a2a" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="44" cy="80" r="6" fill="#ff9aa2" opacity="0.55"/>
    <circle cx="96" cy="80" r="6" fill="#ff9aa2" opacity="0.55"/>
    <ellipse cx="48" cy="118" rx="10" ry="8" fill="#e0923a"/>
    <ellipse cx="92" cy="118" rx="10" ry="8" fill="#e0923a"/>
