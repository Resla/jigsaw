  </g>
  <g class="balloon-blue">
    <path d="M330 270 C 330 234, 296 234, 296 270 C 296 300, 330 316, 330 316 C 330 316, 364 300, 364 270 C 364 234, 330 234, 330 270 Z" fill="#4db7ff"/>
    <ellipse cx="318" cy="254" rx="8" ry="12" fill="#9ad6ff" opacity="0.5"/>
    <path d="M330 316 L 318 392" fill="none" stroke="#6b4a32" stroke-width="2"/>
  </g>

  <g class="butterfly-a">
    <ellipse cx="180" cy="220" rx="10" ry="16" fill="#ff8ac5" transform="rotate(-20 180 220)"/>
    <ellipse cx="198" cy="220" rx="10" ry="16" fill="#ffd36b" transform="rotate(20 198 220)"/>
    <circle cx="189" cy="224" r="3" fill="#3a2a1a"/>
