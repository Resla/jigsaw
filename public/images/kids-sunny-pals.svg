<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Sunny Pals">
  <title>Sunny Pals</title>
  <desc>A sunny hill with a bunny, a puppy, and a kitten, plus bouncing balloons and a smiling sun.</desc>
  <style>
    .sun-rays { transform-origin: 670px 92px; animation: spin 22s linear infinite; }
    .sun-face { transform-origin: 670px 92px; animation: glow 3.4s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s ease-in-out infinite; }
    .cloud-a { animation: drift 18s ease-in-out infinite alternate; }
    .cloud-b { animation: drift 22s ease-in-out infinite alternate-reverse; }
    .cloud-c { animation: drift 16s ease-in-out infinite alternate; }
    .balloon-red { transform-origin: 248px 268px; animation: bob 2.6s ease-in-out infinite; }
    .balloon-yellow { transform-origin: 292px 242px; animation: bob 3s ease-in-out infinite 0.3s; }
    .balloon-blue { transform-origin: 330px 270px; animation: bob 2.8s ease-in-out infinite 0.6s; }
    .kite { transform-origin: 690px 250px; animation: kite 3.2s ease-in-out infinite; }
    .tail { transform-box: fill-box; transform-origin: left center; animation: wag 0.55s ease-in-out infinite; }
    .bunny-arm { transform-box: fill-box; transform-origin: 20% 80%; animation: wave 1.6s ease-in-out infinite; }
    .kitty-tail { transform-box: fill-box; transform-origin: 20% 80%; animation: curl 2.2s ease-in-out infinite; }
    .flower { transform-box: fill-box; transform-origin: bottom center; animation: sway 2.4s ease-in-out infinite; }
    .flower.f2 { animation-delay: 0.4s; }
    .flower.f3 { animation-delay: 0.8s; }
    .flower.f4 { animation-delay: 0.2s; }
    .butterfly-a { animation: flutter 7s linear infinite; }
    .butterfly-b { animation: flutter 9s linear infinite reverse; }
    .bird { animation: fly 12s linear infinite; }
    .bird.b2 { animation-delay: -4s; }
    .tree-top { transform-box: fill-box; transform-origin: bottom center; animation: sway 3.5s ease-in-out infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes glow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes blink {
      0%, 38%, 42%, 100% { transform: scaleY(1); }
      40% { transform: scaleY(0.08); }
    }
    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(36px); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-14px) rotate(4deg); }
    }
    @keyframes kite {
      0%, 100% { transform: translate(0, 0) rotate(-8deg); }
      50% { transform: translate(-10px, 12px) rotate(6deg); }
    }
    @keyframes wag {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(22deg); }
    }
    @keyframes wave {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-28deg); }
    }
    @keyframes curl {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-16deg); }
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes flutter {
      0% { transform: translate(0, 0); }
      25% { transform: translate(80px, -24px); }
      50% { transform: translate(150px, 10px); }
      75% { transform: translate(70px, 28px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes fly {
      0% { transform: translate(0, 0); }
      50% { transform: translate(120px, -16px); }
      100% { transform: translate(240px, 8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .sun-rays, .sun-face, .eye, .cloud-a, .cloud-b, .cloud-c,
      .balloon-red, .balloon-yellow, .balloon-blue, .kite, .tail,
      .bunny-arm, .kitty-tail, .flower, .butterfly-a, .butterfly-b,
      .bird, .tree-top { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd4ff"/>
      <stop offset="55%" stop-color="#c8ecff"/>
      <stop offset="100%" stop-color="#ffe7b3"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ee08a"/>
      <stop offset="100%" stop-color="#5cbc68"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6dcf6a"/>
      <stop offset="100%" stop-color="#3fa24c"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe36b"/>
      <stop offset="70%" stop-color="#ffc53d"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <g class="sun-rays" fill="#ffe27a" opacity="0.9">
    <rect x="662" y="8" width="16" height="36" rx="8"/>
    <rect x="662" y="140" width="16" height="36" rx="8"/>
    <rect x="586" y="84" width="36" height="16" rx="8"/>
    <rect x="718" y="84" width="36" height="16" rx="8"/>
    <rect x="608" y="30" width="16" height="32" rx="8" transform="rotate(-45 616 46)"/>
    <rect x="716" y="30" width="16" height="32" rx="8" transform="rotate(45 724 46)"/>
    <rect x="608" y="122" width="16" height="32" rx="8" transform="rotate(45 616 138)"/>
    <rect x="716" y="122" width="16" height="32" rx="8" transform="rotate(-45 724 138)"/>
  </g>
  <g class="sun-face">
    <circle cx="670" cy="92" r="44" fill="url(#sunGlow)"/>
    <g class="eye">
      <ellipse cx="654" cy="86" rx="5" ry="6" fill="#3a2a1a"/>
      <ellipse cx="686" cy="86" rx="5" ry="6" fill="#3a2a1a"/>
    </g>
    <path d="M654 106c8 12 24 12 32 0" fill="none" stroke="#e36b2d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="646" cy="100" r="6" fill="#ff9aa2" opacity="0.7"/>
    <circle cx="694" cy="100" r="6" fill="#ff9aa2" opacity="0.7"/>
  </g>

  <g class="cloud-a" fill="#fff" opacity="0.95">
    <ellipse cx="120" cy="78" rx="38" ry="22"/>
    <ellipse cx="150" cy="70" rx="30" ry="20"/>
    <ellipse cx="88" cy="80" rx="24" ry="16"/>
  </g>
  <g class="cloud-b" fill="#fff" opacity="0.92">
